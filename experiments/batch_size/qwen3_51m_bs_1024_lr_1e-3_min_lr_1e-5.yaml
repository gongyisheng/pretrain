max_seq_len: 1024
seed: 42

model:
  d_model: 512
  n_layers: 8
  vocab_size: 50257
  attn:
  - attn_cls: gqa
    attn_kwargs:
      n_heads: 8
      n_kv_heads: 4
      qk_norm: true
  mlp:
  - mlp_cls: dense
    mlp_kwargs:
      intermediate_size: 1536
  norm_cls: rmsnorm
  pos_emb_cls: rope
  pos_emb_kwargs:
    rope_theta: 10000.0
data:
  dataset: openwebtext
  tokenizer_path: tokenizers/custom_bpe_50k
  data_dir: data/
  val_split: 0.01
  num_workers: 4
training:
  batch_size: 16
  gradient_accumulation_steps: 64
  max_steps: 12500
  mixed_precision: bf16
  grad_clip: 1.0
  checkpoint_dir: checkpoints/batch_size/qwen3_51m_bs_1024_lr_1e-3_min_lr_1e-5/
  checkpoint_every: 5000
  eval_every: 100
  eval_steps: 100
optimizer:
  optimizer_cls: adamw
  lr: 1e-3
  weight_decay: 0.1
  optimizer_kwargs:
    betas:
    - 0.9
    - 0.99
    eps: 1e-8
scheduler:
  name: cosine
  warmup_steps: 375
  min_lr: 1e-5
logging:
  wandb_project: pretrain-batch-size
  wandb_run_name: qwen3-51m-bs-1024-lr-1e-3-min-lr-1e-5
  log_every: 10
