max_seq_len: 1024
seed: 42

model:
  d_model: 512
  n_layers: 8
  vocab_size: 50257
  attn:
  - attn_cls: gqa
    attn_kwargs:
      n_heads: 8
      n_kv_heads: 4
      qk_norm: true
      dropout: 0.0
  mlp:
  - mlp_cls: dense
    mlp_kwargs:
      intermediate_size: 1536
      dropout: 0.0
  norm_cls: rmsnorm
  pos_emb_cls: rope
  pos_emb_kwargs:
    rope_theta: 10000.0
  dropout_embd: 0.0
data:
  dataset: openwebtext
  tokenizer_path: tokenizers/custom_bpe_50k
  data_dir: data/
  val_split: 0.01
  num_workers: 4
quantization:
  enabled: true
  dtype:
    weight: int4
    act: bf16
    grad_out: bf16
  scale:
    weight:
      granularity: blockwise
      block_shape: [16, 16]
    scale_dtype: fp8_e4m3
    enable_global_scale: true
  rounding:
    weight: RNE
    act: RNE
    grad_out: RNE
  rotation:
    rotation_cls: hadamard
    rotation_kwargs:
      block_size: 16
      random_sign: true
    rotation_axes:
      weight:
        fwd: [-1]
        dgrad: [-2]
      act:
        fwd: []
        wgrad: []
      grad_out:
        dgrad: []
        wgrad: []
  exclude: [lm_head]
training:
  batch_size: 16
  gradient_accumulation_steps: 16
  max_steps: 50000
  mixed_precision: bf16
  grad_clip: 1.0
  checkpoint_dir: checkpoints/int4_weight_hadamard/qwen3_51m_int4_w4a16_hadamard_16_asymmetric/
  checkpoint_every: 5000
  eval_every: 100
  eval_steps: 100
optimizer:
  optimizer_cls: muonadam
  lr: 5e-4
  weight_decay: 0.1
  optimizer_kwargs:
    adam_cls: adamw
    adam_kwargs:
      betas:
      - 0.9
      - 0.95
      eps: 1e-8
    muon_kwargs:
      momentum: 0.95
      nesterov: true
      adjust_lr_fn: match_rms_adamw
      eps: 1e-8
scheduler:
  name: cosine
  warmup_steps: 1500
  min_lr: 5e-5
logging:
  wandb_project: pretrain-int4-weight-hadamard
  wandb_run_name: qwen3-51m-int4-w4a16-hadamard-16-asymmetric
  log_every: 10
