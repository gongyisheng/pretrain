max_seq_len: 1024
model:
  d_model: 512
  n_layers: 8
  vocab_size: 50257
  attn:
  - attn_cls: gqa
    attn_kwargs:
      n_heads: 8
      n_kv_heads: 4
      qk_norm: true
  mlp:
  - mlp_cls: moe
    mlp_kwargs:
      intermediate_size: 192
      n_routed_experts: 768
      n_routed_experts_per_token: 6
      n_shared_experts: 2
      aux_loss: false
      expert_bias: true
      expert_bias_update_rate: 0.001
      router_score_fn: sigmoid
  norm_cls: rmsnorm
  pos_emb_cls: rope
  pos_emb_kwargs:
    rope_theta: 10000.0
data:
  dataset: openwebtext
  tokenizer_path: tokenizers/custom_bpe_50k
  data_dir: data/
  val_split: 0.01
  num_workers: 4
training:
  batch_size: 16
  gradient_accumulation_steps: 16
  max_steps: 50000
  mixed_precision: bf16
  grad_clip: 1.0
  checkpoint_dir: checkpoints/moe_ultra_sparse/qwen3_1852m_a51m_is192_e768_s2r6_adamw/
  checkpoint_every: 5000
  eval_every: 100
  eval_steps: 25
optimizer:
  name: adamw
  lr: 1e-3
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
scheduler:
  name: cosine
  warmup_steps: 1500
  min_lr: 1e-4
logging:
  wandb_project: pretrain-moe-ultra-sparse
  wandb_run_name: qwen3-1852m-a51m-is192-e768-s2r6-adamw
  log_every: 100
