name: PR Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'configs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SPLIT_BY_TEST: -n 12 --dist load
  SPLIT_BY_FILE: -n 6 --dist loadfile

jobs:
  prepare:
    runs-on: [self-hosted]
    outputs:
      has_data: ${{ steps.detect.outputs.has_data }}
      has_kernel: ${{ steps.detect.outputs.has_kernel }}
      has_layers: ${{ steps.detect.outputs.has_layers }}
      has_metrics: ${{ steps.detect.outputs.has_metrics }}
      has_model: ${{ steps.detect.outputs.has_model }}
      has_quant: ${{ steps.detect.outputs.has_quant }}
      has_training: ${{ steps.detect.outputs.has_training }}
      has_utils: ${{ steps.detect.outputs.has_utils }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' || context.eventName === 'push') {
              core.setOutput('has_data', 'true');
              core.setOutput('has_kernel', 'true');
              core.setOutput('has_layers', 'true');
              core.setOutput('has_metrics', 'true');
              core.setOutput('has_model', 'true');
              core.setOutput('has_quant', 'true');
              core.setOutput('has_training', 'true');
              core.setOutput('has_utils', 'true');
              return;
            }

            const pr = context.payload.pull_request;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 }
            );
            const names = files.map(f => f.filename);

            const matchAny = (regexps) => names.some(n => regexps.some(r => r.test(n)));

            // Each flag maps a source subtree to its test directory:
            //   src/data      -> tests/fast/data
            //   src/kernel    -> tests/fast/kernel
            //   src/layers    -> tests/fast/layers
            //   src/metrics   -> tests/fast/metrics
            //   src/model     -> tests/fast/model
            //   src/quant     -> tests/fast/quant
            //   src/utils     -> tests/fast/utils
            // has_quant also fires on src/kernel, since the quantized GEMM paths
            // call straight into those kernels.
            // has_metrics and has_quant each fire on the other's subtree: the
            // quantization fold is called from inside quantized_gemm, so
            // src/metrics/quant.py is on the quant hot path, and src/metrics reads
            // back through src/quant's dequantize and format helpers.
            // has_training (tests/fast/training + tests/e2e) is the integration
            // catch-all: any src/ change runs it, since the end-to-end training
            // path can break from a change anywhere in the stack.
            const has_data = matchAny([/^src\/data\//]);
            const has_kernel = matchAny([/^src\/kernel\//]);
            const has_layers = matchAny([/^src\/layers\//]);
            const has_metrics = matchAny([/^src\/metrics\//, /^src\/quant\//]);
            const has_model = matchAny([/^src\/model\//]);
            const has_quant = matchAny([
              /^src\/quant\//,
              /^src\/kernel\//,
              /^src\/metrics\//,
            ]);
            const has_utils = matchAny([/^src\/utils\//]);
            const has_training = matchAny([
              /^src\//,
              /^scripts\/train\.py$/,
            ]);

            core.setOutput('has_data', String(has_data));
            core.setOutput('has_kernel', String(has_kernel));
            core.setOutput('has_layers', String(has_layers));
            core.setOutput('has_metrics', String(has_metrics));
            core.setOutput('has_model', String(has_model));
            core.setOutput('has_quant', String(has_quant));
            core.setOutput('has_training', String(has_training));
            core.setOutput('has_utils', String(has_utils));

            core.info(`has_data=${has_data} has_kernel=${has_kernel} has_layers=${has_layers} has_metrics=${has_metrics} has_model=${has_model} has_quant=${has_quant} has_training=${has_training} has_utils=${has_utils}`);

  lint:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - run: uv run ruff check src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - run: uv run ruff format --check src/ tests/
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

  test-data:
    needs: [prepare]
    if: needs.prepare.outputs.has_data == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # forces rebuild of the C++ `_bpe_engine` extension
      - run: uv sync --frozen --reinstall-package pretrain
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run data tests (CPU only)
        env:
          CUDA_VISIBLE_DEVICES: ""
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: uv run pytest tests/fast/data/ $SPLIT_BY_TEST

  test-layers:
    needs: [prepare]
    if: needs.prepare.outputs.has_layers == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run layer tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/layers/ $SPLIT_BY_FILE

  test-kernel:
    needs: [prepare]
    if: needs.prepare.outputs.has_kernel == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run kernel tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/kernel/ $SPLIT_BY_TEST

  test-quant:
    needs: [prepare]
    if: needs.prepare.outputs.has_quant == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run quant tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/quant/ $SPLIT_BY_TEST

  test-metrics:
    needs: [prepare]
    if: needs.prepare.outputs.has_metrics == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      # No tokenizer/dataset restore: these tests use a fake tokenizer and never
      # touch .bin files, so they need neither the HF download nor the C++ rebuild.
      - name: Run metrics tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/metrics/ $SPLIT_BY_TEST

  test-model:
    needs: [prepare]
    if: needs.prepare.outputs.has_model == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run model tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/model/ $SPLIT_BY_FILE

  test-utils:
    needs: [prepare]
    if: needs.prepare.outputs.has_utils == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: uv sync --frozen
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Run utils tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest tests/fast/utils/ $SPLIT_BY_FILE

  test-training:
    needs: [prepare]
    if: needs.prepare.outputs.has_training == 'true'
    runs-on: [self-hosted]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # forces rebuild of the C++ `_bpe_engine` extension
      - run: uv sync --frozen --reinstall-package pretrain
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv

      - name: Restore tokenizer + dataset
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
          HF_DATA_DIR: ${{ runner.tool_cache }}/hf-openwebtext-exp
        run: |
          if [ ! -d "$HF_DATA_DIR/tokenizers" ] || [ ! -d "$HF_DATA_DIR/data" ]; then
            mkdir -p "$HF_DATA_DIR"
            uv run hf download gongyisheng/openwebtext-exp --repo-type dataset --local-dir "$HF_DATA_DIR"
          fi
          ln -sfn "$HF_DATA_DIR/tokenizers" tokenizers
          ln -sfn "$HF_DATA_DIR/data" data

      - name: Run training tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.tool_cache }}/ci-venv
        run: |
          uv run python tests/ci/gpu_lock_exec.py -- \
            uv run pytest \
              tests/fast/training/ \
              tests/e2e/ \
              $SPLIT_BY_FILE
